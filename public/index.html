<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
</head>
<body>

    <h1>Admin Dashboard</h1>

    <div class="container">
        <div class="box">
            <h3>Upload Document</h3>
            <label class="custom-file-upload">
                <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx">
                Choose File
            </label>
            <button class="button" onclick="uploadFile()">Upload</button>
        </div>

        <div class="search">
            <input type="text" placeholder="Search Document...">
        </div>

        <div>
            <table>
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Name</th>
                        <th>Uploaded At</th>
                        <th>Status</th>
                        <th>Action</th> </tr>
                    </tr>
                </thead>
                <tbody id="documentTableBody">
                    <tr>
                        <td style="text-align:center;"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div> 
    
<a href="/chat" style="font-size: 18px; margin-top: 10px;">Go to Document Chat Assistant →</a>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #aaa5a5;
        }

        h1 {
            margin-top: 20px;
        }

        .container {
            width: 800px;
            background-color: cornsilk;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            padding: 20px;
        }

        .box {
            width: 100%;
            height: 150px;
            border: 1px dashed pink;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
        }

        .search {
            width: 100%;
        }

        .search input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid lightgray;
            border-radius: 4px;
        }

        table {
            width: 100%;
            /*border-collapse: collapse;*/
            background: white;
        }

        th, td {
            border: 1px solid Gainsboro;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: whitesmoke;
        }

        /*th:first-child, td:first-child {
            width: 60px;
            text-align: center;
        }*/

       .custom-file-upload input[type="file"] {
          display: none;
        } 

        .custom-file-upload {
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 18px; 
            color: white; 
            background-color: blue; 
            /* Optional: Add a subtle border */
            border: 1px solid darkgray;
            font-family: Arial, sans-serif;
        }

        .button {
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            background-color: orangered;
            border: 1px solid darkgray;
            font-family: Arial, sans-serif;
        }
       
    </style>

    <script>
        async function loadDocuments() {
            const res = await fetch('/documents');
            const docs = await res.json();
            const tbody = document.getElementById('documentTableBody');
            
            tbody.innerHTML = '';

            if (docs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No documents</td></tr>';
                return;
            }

            let tableRows = '';
            for (let i = 0; i < docs.length; i++) {
                const d = docs[i];
                const date = new Date(d.uploaded_at).toLocaleString();
                const serialNumber = i + 1;
        
                tableRows += '<tr>' +
                    '<td>' + serialNumber + '</td>' +
                    '<td>' + d.file_name + '</td>' +
                    '<td>' + date + '</td>' +
                    '<td><span class="status-badge">Uploaded</span></td>' +
                    '<td><button onclick="deleteDocument(' + d.id + ')">Delete</button></td>' +
                '</tr>';
            }
            tbody.innerHTML = tableRows;
        }

        async function deleteDocument(documentId) {
            if (confirm("Are you sure you want to delete this document?")) {
                const res = await fetch('/documents/' + documentId, {
                method: 'DELETE'
            });
            if (res.ok) {
                alert('Document deleted successfully!');
                loadDocuments();
            } else {
                alert('Failed to delete the document.');
                }
            }
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert('Select a file first');
            const fd = new FormData();
            fd.append('file', file);
            await fetch('/upload', { method: 'POST', body: fd });
            loadDocuments();
        }

        loadDocuments();
    </script>
</body>
</html>
